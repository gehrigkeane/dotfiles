#
# TMUX Configuration
#
# http://www.drbunsen.org/the-text-triumvirate/
# https://hackernoon.com/a-gentle-introduction-to-tmux-8d784c404340
# TODO: https://www.hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/
# TODO: https://github.com/gpakosz/.tmux
# TODO: https://lucasfcosta.com/2019/02/10/terminal-guide-2019.html

set-option -g prefix C-b
set-option -g prefix2 f1

# Set terminal colors
# ref: https://gist.github.com/oca159/69f7aab040d3f462cc26accabbd4ea67
set-option -sa terminal-overrides ",xterm*:Tc"
# set -g default-terminal "xterm-ghostty"
# set -g default-terminal "screen-256color"

set -g default-command "reattach-to-user-namespace -l zsh"

set -g mouse on

set -g history-limit 50000

# Automatically renumber windows sequentially when a window is closed,
# so there are no gaps in the window index.
set -g renumber-windows on

# Window reordering
# <prefix> + < / >  swap current window left/right (repeatable)
# <prefix> + m      send current window to a typed index
bind-key -r "<" swap-window -d -t -1
bind-key -r ">" swap-window -d -t +1
bind-key m command-prompt -p "send window to:" "move-window -t '%%'"

#
# Pane focus visibility (gruvbox-tuned to match Ghostty theme)
#
# Dims the *contents* of inactive panes and applies a bright, thick border
# to the active pane so focus is unmistakable at a glance.
#
# Refs:
#   man tmux                                  (search: pane-border-style, window-style)
#   https://github.com/tmux/tmux/wiki/Recipes (look for "Highlight active pane")
#   tmux 3.2+ for pane-border-lines & pane-border-indicators
#
# Active pane border: bold gruvbox bright yellow
# Inactive pane border: gruvbox bg2 (recedes)
set -g pane-border-style        "fg=#3c3836"
set -g pane-active-border-style "fg=#fabd2f,bold"
set -g pane-border-lines heavy
set -g pane-border-indicators both

# Inactive pane content dimming. tmux merges these with app escape codes,
# so full-screen TUIs (htop, vim) can override — that's expected.
set -g window-style        "fg=#a89984,bg=#1d2021"
set -g window-active-style "fg=#ebdbb2,bg=#282828"

# Pane number overlay (<prefix> + q): bigger, more readable
set -g display-panes-time 2000
set -g display-panes-colour        "#7c6f64"
set -g display-panes-active-colour "#fb4934"

# Copy mode
setw -g mode-keys vi
bind ` copy-mode
unbind [
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind y run "tmux save-buffer - | reattach-to-user-namespace pbcopy"

# https://stackoverflow.com/questions/10543684/how-can-i-clear-scrollback-buffer-in-tmux
bind-key -n C-k send-keys -R C-l \; clear-history

# https://unix.stackexchange.com/questions/70598/tmux-showing-sessions-on-bottom-row
set -g status-right-length 80
set -g status-right '#( exec tmux ls | cut -d " " -f 1-3 | tr "\\n" "," )'

#
# List of plugins
#
# install tpm: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# ref: https://github.com/tmux-plugins/tpm
#
# install plugins: <prefix> + I
# update plugins: <prefix> + U
# clean plugins: <prefix> + alt + u
#

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Fuzzy picker for sessions/windows/panes/commands.
# <prefix> + F  open menu (switch / move / swap / link / rename / kill)
set -g @plugin 'sainnhe/tmux-fzf'
TMUX_FZF_LAUNCH_KEY="F"

# save: <prefix> + Ctrl-s
# res:  <prefix> + Ctrl-r
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'

set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-boot 'on'
# set -g @continuum-boot-options 'kitty'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'

#
# TMUX Powerline
#
# ref: ~/.tmux/plugins/tmux-powerline/...
set -g @plugin 'erikw/tmux-powerline'

# https://powerline.readthedocs.io/en/latest/usage/other.html#tmux-statusline
# Homebrew python: /usr/local/bin/python3
# /opt/homebrew/opt/python@3.12/bin/pip3 install powerline-status
# /opt/homebrew/opt/python@3.12/Frameworks/Python.framework/Versions/
# run-shell "powerline-daemon -q"
# source "/opt/homebrew/opt/python@3.12/Frameworks/Python.framework/Versions/3.12/lib/python3.12/site-packages/powerline/bindings/tmux/powerline.conf"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# run -b '~/.tmux/plugins/tpm/tpm'
run '~/.tmux/plugins/tpm/tpm'
